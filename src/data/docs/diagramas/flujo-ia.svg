<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="cs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.10"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A7A9C"/>
    </marker>
    <marker id="arAI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#01A88D"/>
    </marker>
    <marker id="arOpt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="42" font-size="24" font-weight="700" fill="#1A2433">Detalle: flujo end-to-end y servicio IA</text>
  <text x="40" y="64" font-size="13" fill="#5A7A9C">Caso: generar el diccionario de un objeto · el prediccionario vive en Google Sheets · matching contra el RCN → generación con Claude</text>

  <!-- ============ SECTION A: SEQUENCE ============ -->
  <text x="40" y="105" font-size="14" font-weight="700" fill="#1A2433">
    <tspan fill="#FF9900">1 ·</tspan> Flujo end-to-end
  </text>

  <!-- LANE HEADERS -->
  <g transform="translate(40, 120)">
    <rect width="160" height="44" rx="6" fill="#FFFFFF" stroke="#DD344C" stroke-width="1.5"/>
    <rect width="160" height="3" rx="1" fill="#DD344C"/>
    <text x="80" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#DD344C">AWS AMPLIFY</text>
    <text x="80" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#1A2433">bbva-ingesta-app</text>
  </g>

  <g transform="translate(212, 120)">
    <rect width="160" height="44" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.5"/>
    <rect width="160" height="3" rx="1" fill="#ED7100"/>
    <text x="80" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#ED7100">ECS FARGATE</text>
    <text x="80" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#1A2433">bbva-ingesta-api</text>
  </g>

  <g transform="translate(384, 120)">
    <rect width="160" height="44" rx="6" fill="#FFFFFF" stroke="#C925D1" stroke-width="1.5"/>
    <rect width="160" height="3" rx="1" fill="#C925D1"/>
    <text x="80" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#C925D1">AURORA POSTGRESQL</text>
    <text x="80" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#1A2433">generation_jobs</text>
  </g>

  <g transform="translate(556, 120)">
    <rect width="160" height="44" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.5"/>
    <rect width="160" height="3" rx="1" fill="#ED7100"/>
    <text x="80" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#ED7100">ECS FARGATE</text>
    <text x="80" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#1A2433">bbva-ingesta-api-ai</text>
  </g>

  <g transform="translate(728, 120)">
    <rect width="160" height="44" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.5"/>
    <rect width="160" height="3" rx="1" fill="#ED7100"/>
    <text x="80" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#ED7100">ECS SOBRE EC2</text>
    <text x="80" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#1A2433">rcn-api</text>
  </g>

  <g transform="translate(900, 120)">
    <rect width="160" height="44" rx="6" fill="#FFFFFF" stroke="#01A88D" stroke-width="2"/>
    <rect width="160" height="3" rx="1" fill="#01A88D"/>
    <text x="80" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#01A88D">AMAZON BEDROCK</text>
    <text x="80" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#1A2433">Claude Sonnet 5.5</text>
  </g>

  <g transform="translate(1072, 120)">
    <rect width="160" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <rect width="160" height="3" rx="1" fill="#6B7280"/>
    <text x="80" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#6B7280">EXTERNO · GOOGLE SHEETS</text>
    <text x="80" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#1A2433">prediccionario</text>
  </g>

  <!-- LIFELINES -->
  <line x1="120" y1="170" x2="120" y2="466" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="292" y1="170" x2="292" y2="466" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="464" y1="170" x2="464" y2="466" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="636" y1="170" x2="636" y2="466" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="808" y1="170" x2="808" y2="466" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="980" y1="170" x2="980" y2="466" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="1152" y1="170" x2="1152" y2="466" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- PHASE DIVIDERS -->
  <text x="44" y="177" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="1">FASE 1 · PETICIÓN (TRABAJO EN SEGUNDO PLANO)</text>

  <line x1="40" y1="258" x2="1240" y2="258" stroke="#E0E4EA" stroke-width="0.8" stroke-dasharray="2,3"/>
  <text x="44" y="270" font-size="9" font-weight="700" fill="#0EA5E9" letter-spacing="1">FASE 2 · LECTURA Y MATCHING CONTRA EL RCN</text>

  <line x1="40" y1="356" x2="1240" y2="356" stroke="#E0E4EA" stroke-width="0.8" stroke-dasharray="2,3"/>
  <text x="44" y="368" font-size="9" font-weight="700" fill="#01A88D" letter-spacing="1">FASE 3 · GENERACIÓN CON CLAUDE (solo campos sin match)</text>

  <line x1="40" y1="394" x2="1240" y2="394" stroke="#E0E4EA" stroke-width="0.8" stroke-dasharray="2,3"/>
  <text x="44" y="406" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="1">FASE 4 · RESULTADO</text>

  <!-- ===== FASE 1: PETICIÓN ===== -->

  <!-- STEP 1: Amplify → api -->
  <line x1="120" y1="201" x2="292" y2="201" stroke="#5A7A9C" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="206" y="195" text-anchor="middle" font-size="10" fill="#5A7A9C">POST /dictionary-generator/lite-co</text>
  <circle cx="120" cy="201" r="11" fill="#FF9900"/>
  <text x="120" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">1</text>

  <!-- STEP 2: api → Aurora -->
  <line x1="292" y1="219" x2="464" y2="219" stroke="#5A7A9C" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="378" y="213" text-anchor="middle" font-size="10" fill="#5A7A9C">crea el trabajo</text>
  <circle cx="292" cy="219" r="11" fill="#FF9900"/>
  <text x="292" y="223" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">2</text>

  <!-- STEP 3: api → Amplify -->
  <line x1="292" y1="242" x2="120" y2="242" stroke="#5A7A9C" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="206" y="236" text-anchor="middle" font-size="10" fill="#5A7A9C">202 · id del trabajo</text>
  <circle cx="292" cy="242" r="11" fill="#FF9900"/>
  <text x="292" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
  <text x="474" y="246" font-size="9.5" fill="#94A3B8" font-style="italic">el front consulta GET /generation-jobs/{id} hasta que termina</text>

  <!-- ===== FASE 2: LECTURA Y MATCHING ===== -->

  <!-- STEP 4: api → api-ai -->
  <line x1="292" y1="285" x2="636" y2="285" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="464" y="279" text-anchor="middle" font-size="10" fill="#0EA5E9">POST /generate-dictionary-lite-co {hoja, país, periodicidad}</text>
  <circle cx="292" cy="285" r="11" fill="#FF9900"/>
  <text x="292" y="289" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">4</text>

  <!-- STEP 5: api-ai → Sheets -->
  <line x1="636" y1="305" x2="1152" y2="305" stroke="#5A7A9C" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="1066" y="299" text-anchor="middle" font-size="10" fill="#5A7A9C">lee los campos del prediccionario</text>
  <circle cx="636" cy="305" r="11" fill="#FF9900"/>
  <text x="636" y="309" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">5</text>

  <!-- STEP 6: api-ai → rcn-api -->
  <line x1="636" y1="325" x2="808" y2="325" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="722" y="319" text-anchor="middle" font-size="10" fill="#0EA5E9">búsquedas exacta + semántica</text>
  <circle cx="636" cy="325" r="11" fill="#FF9900"/>
  <text x="636" y="329" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">6</text>

  <!-- STEP 7: api-ai → Bedrock (analizador y juez) -->
  <line x1="636" y1="345" x2="980" y2="345" stroke="#01A88D" stroke-width="2" marker-end="url(#arAI)"/>
  <text x="905" y="339" text-anchor="middle" font-size="10" font-weight="600" fill="#01A88D">analizador y juez sobre los candidatos</text>
  <circle cx="636" cy="345" r="11" fill="#FF9900"/>
  <text x="636" y="349" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">7</text>

  <!-- ===== FASE 3: GENERACIÓN ===== -->

  <!-- STEP 8: api-ai → Bedrock (naming) -->
  <line x1="636" y1="383" x2="980" y2="383" stroke="#01A88D" stroke-width="2" marker-end="url(#arAI)"/>
  <text x="808" y="377" text-anchor="middle" font-size="10" font-weight="600" fill="#01A88D">naming + descripción · acorta si pasa de 30 caracteres</text>
  <circle cx="636" cy="383" r="11" fill="#FF9900"/>
  <text x="636" y="387" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">8</text>

  <!-- ===== FASE 4: RESULTADO ===== -->

  <!-- STEP 9: api-ai → Sheets -->
  <line x1="636" y1="420" x2="1152" y2="420" stroke="#5A7A9C" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="980" y="414" text-anchor="middle" font-size="10" fill="#5A7A9C">escribe el diccionario y la marca de cada campo (RCN, REVISAR…)</text>
  <circle cx="636" cy="420" r="11" fill="#FF9900"/>
  <text x="636" y="424" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">9</text>

  <!-- STEP 10: api-ai → api -->
  <line x1="636" y1="440" x2="292" y2="440" stroke="#5A7A9C" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="464" y="434" text-anchor="middle" font-size="10" fill="#5A7A9C">resultado + métricas (campos, tokens, duración)</text>
  <circle cx="636" cy="440" r="11" fill="#FF9900"/>
  <text x="636" y="444" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">10</text>

  <!-- STEP 11: api → Aurora -->
  <line x1="292" y1="460" x2="464" y2="460" stroke="#5A7A9C" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="378" y="454" text-anchor="middle" font-size="10" fill="#5A7A9C">cierra el trabajo</text>
  <circle cx="292" cy="460" r="11" fill="#FF9900"/>
  <text x="292" y="464" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">11</text>
  <text x="474" y="464" font-size="9.5" fill="#94A3B8" font-style="italic">sus métricas alimentan la pestaña Observabilidad del admin</text>

  <!-- ============ SECTION B: ZOOM ============ -->
  <text x="40" y="490" font-size="14" font-weight="700" fill="#1A2433">
    <tspan fill="#FF9900">2 ·</tspan> Zoom: api-ai + Bedrock
  </text>

  <!-- LEFT CARD: api-ai detail -->
  <g transform="translate(40, 504)" filter="url(#cs)">
    <rect width="600" height="196" rx="10" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.5"/>
    <rect width="600" height="4" rx="2" fill="#ED7100"/>
    <text x="20" y="26" font-size="9" font-weight="700" fill="#ED7100">SERVICIO IA · ECS FARGATE</text>
    <text x="20" y="46" font-size="16" font-weight="700" fill="#1A2433">bbva-ingesta-api-ai</text>
    <text x="20" y="62" font-size="10" fill="#5A7A9C">Lee y escribe el prediccionario en Sheets · matching RCN · naming (TC-015)</text>

    <!-- Provider switch -->
    <g transform="translate(20, 76)">
      <rect width="275" height="52" rx="6" fill="#FFF8EE" stroke="#ED7100" stroke-width="0.8"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#ED7100">PROVIDER SWITCHABLE</text>
      <text x="12" y="32" font-size="10" font-weight="600" fill="#1A2433">env LLM_PROVIDER = bedrock | anthropic</text>
      <text x="12" y="46" font-size="9" fill="#5A7A9C">Mismo cliente, dos backends intercambiables</text>
    </g>

    <!-- Retry -->
    <g transform="translate(305, 76)">
      <rect width="275" height="52" rx="6" fill="#FFF8EE" stroke="#ED7100" stroke-width="0.8"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#ED7100">RETRY · EXPONENTIAL BACKOFF</text>
      <text x="12" y="32" font-size="10" font-weight="600" fill="#1A2433">max 5 intentos · espera 2^n s</text>
      <text x="12" y="46" font-size="9" fill="#5A7A9C">Trigger: 429 y 529 (límite / sobrecarga) y cortes de red</text>
    </g>

    <!-- Cascade strategy -->
    <g transform="translate(20, 136)">
      <rect width="275" height="52" rx="6" fill="#FFF8EE" stroke="#ED7100" stroke-width="0.8"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#ED7100">ORDEN DE RESOLUCIÓN</text>
      <text x="12" y="32" font-size="10" font-weight="600" fill="#1A2433">1) reglas · 2) juez sobre RCN · 3) generación</text>
      <text x="12" y="46" font-size="9" fill="#5A7A9C">Generación solo sin match · RCN caído: 503</text>
    </g>

    <!-- Prompts -->
    <g transform="translate(305, 136)">
      <rect width="275" height="52" rx="6" fill="#FFF8EE" stroke="#ED7100" stroke-width="0.8"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#ED7100">PROMPTS · NAMING TC-015</text>
      <text x="12" y="32" font-size="10" font-weight="600" fill="#1A2433">analizador · juez · naming · acortar</text>
      <text x="12" y="46" font-size="9" fill="#5A7A9C">Few-shot con catálogos BBVA por país</text>
    </g>
  </g>

  <!-- RIGHT CARD: Bedrock detail -->
  <g transform="translate(660, 504)" filter="url(#cs)">
    <rect width="580" height="196" rx="10" fill="#FFFFFF" stroke="#01A88D" stroke-width="2"/>
    <rect width="580" height="4" rx="2" fill="#01A88D"/>
    <text x="20" y="26" font-size="9" font-weight="700" fill="#01A88D">AMAZON BEDROCK · LLM GESTIONADO</text>
    <text x="20" y="46" font-size="16" font-weight="700" fill="#1A2433">Claude (vía Bedrock)</text>
    <text x="20" y="62" font-size="10" fill="#5A7A9C">1 modelo · acceso por IAM, sin clave de API</text>

    <!-- Models -->
    <g transform="translate(20, 76)">
      <rect width="540" height="52" rx="6" fill="#E6F8F4" stroke="#01A88D" stroke-width="0.8"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#01A88D">MODEL IDS · USO</text>
      <text x="12" y="32" font-size="10" font-family="Consolas, Courier New, monospace" fill="#1A2433">claude-sonnet-5-5  →  analizador, juez y naming</text>
      <text x="12" y="46" font-size="10" font-family="Consolas, Courier New, monospace" fill="#1A2433">mismo modelo por defecto (MATCHING_MODELO, LLM_MODEL)</text>
    </g>

    <!-- IAM -->
    <g transform="translate(20, 136)">
      <rect width="265" height="52" rx="6" fill="#E6F8F4" stroke="#01A88D" stroke-width="0.8"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#01A88D">IAM TASK ROLE</text>
      <text x="12" y="32" font-size="10" font-family="Consolas, monospace" fill="#1A2433">bedrock:InvokeModel</text>
      <text x="12" y="46" font-size="9" fill="#5A7A9C">scope: cross-region inference profile</text>
    </g>

    <!-- Latency -->
    <g transform="translate(295, 136)">
      <rect width="265" height="52" rx="6" fill="#E6F8F4" stroke="#01A88D" stroke-width="0.8"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#01A88D">LATENCIA TÍPICA</text>
      <text x="12" y="32" font-size="10" font-weight="600" fill="#1A2433">Sonnet 3-12 s</text>
      <text x="12" y="46" font-size="9" fill="#5A7A9C">batch processing por lista de campos</text>
    </g>
  </g>

</svg>
