<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="cs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.10"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A7A9C"/>
    </marker>
    <marker id="arAI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#01A88D"/>
    </marker>
    <marker id="arOpt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="42" font-size="24" font-weight="700" fill="#1A2433">Detalle: flujo end-to-end y servicio IA</text>
  <text x="40" y="64" font-size="13" fill="#5A7A9C">Caso: generar diccionario de objeto · matching contra el RCN (rcn-api) → generación con Claude</text>

  <!-- ============ SECTION A: SEQUENCE ============ -->
  <text x="40" y="105" font-size="14" font-weight="700" fill="#1A2433">
    <tspan fill="#FF9900">1 ·</tspan> Flujo end-to-end
  </text>

  <!-- LANE HEADERS -->
  <g transform="translate(40, 120)">
    <rect width="190" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <rect width="190" height="3" rx="1" fill="#6B7280"/>
    <text x="95" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#6B7280">EXTERNO</text>
    <text x="95" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#1A2433">Usuario</text>
  </g>

  <g transform="translate(240, 120)">
    <rect width="190" height="44" rx="6" fill="#FFFFFF" stroke="#DD344C" stroke-width="1.5"/>
    <rect width="190" height="3" rx="1" fill="#DD344C"/>
    <text x="95" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#DD344C">AWS AMPLIFY</text>
    <text x="95" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#1A2433">bbva-ingesta-app</text>
  </g>

  <g transform="translate(440, 120)">
    <rect width="190" height="44" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.5"/>
    <rect width="190" height="3" rx="1" fill="#ED7100"/>
    <text x="95" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#ED7100">ECS FARGATE</text>
    <text x="95" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#1A2433">bbva-ingesta-api</text>
  </g>

  <g transform="translate(640, 120)">
    <rect width="190" height="44" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.5"/>
    <rect width="190" height="3" rx="1" fill="#ED7100"/>
    <text x="95" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#ED7100">ECS FARGATE</text>
    <text x="95" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#1A2433">bbva-ingesta-api-ai</text>
  </g>

  <g transform="translate(840, 120)">
    <rect width="190" height="44" rx="6" fill="#FFFFFF" stroke="#01A88D" stroke-width="2"/>
    <rect width="190" height="3" rx="1" fill="#01A88D"/>
    <text x="95" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#01A88D">AMAZON BEDROCK</text>
    <text x="95" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#1A2433">Claude</text>
  </g>

  <g transform="translate(1040, 120)">
    <rect width="190" height="44" rx="6" fill="#FFFFFF" stroke="#C925D1" stroke-width="1.5"/>
    <rect width="190" height="3" rx="1" fill="#C925D1"/>
    <text x="95" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#C925D1">DATA LAYER</text>
    <text x="95" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#1A2433">Aurora · S3</text>
  </g>

  <!-- LIFELINES -->
  <line x1="135" y1="170" x2="135" y2="450" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="335" y1="170" x2="335" y2="450" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="535" y1="170" x2="535" y2="450" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="735" y1="170" x2="735" y2="450" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="935" y1="170" x2="935" y2="450" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="1135" y1="170" x2="1135" y2="450" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- PHASE DIVIDERS -->
  <line x1="40" y1="258" x2="1240" y2="258" stroke="#E0E4EA" stroke-width="0.8" stroke-dasharray="2,3"/>
  <text x="44" y="254" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="1">FASE 1 · SETUP &amp; LECTURA</text>
  <text x="44" y="270" font-size="9" font-weight="700" fill="#0EA5E9" letter-spacing="1">FASE 2 · MATCHING CONTRA EL RCN (rcn-api + juez con Claude)</text>

  <line x1="40" y1="320" x2="1240" y2="320" stroke="#E0E4EA" stroke-width="0.8" stroke-dasharray="2,3"/>
  <text x="44" y="332" font-size="9" font-weight="700" fill="#01A88D" letter-spacing="1">FASE 3 · GENERACIÓN CON CLAUDE (solo campos sin match)</text>

  <line x1="40" y1="408" x2="1240" y2="408" stroke="#E0E4EA" stroke-width="0.8" stroke-dasharray="2,3"/>
  <text x="44" y="420" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="1">FASE 4 · PERSISTENCIA</text>

  <!-- ===== FASE 1: SETUP ===== -->

  <!-- STEP 1: User → Amplify -->
  <line x1="135" y1="190" x2="335" y2="190" stroke="#5A7A9C" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="235" y="184" text-anchor="middle" font-size="10" fill="#5A7A9C">HTTPS · navega a /projects/{id}</text>
  <circle cx="135" cy="190" r="11" fill="#FF9900"/>
  <text x="135" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">1</text>

  <!-- STEP 2: Amplify → api -->
  <line x1="335" y1="213" x2="535" y2="213" stroke="#5A7A9C" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="435" y="207" text-anchor="middle" font-size="10" fill="#5A7A9C">REST GET /api/v1/objects/{id}</text>
  <circle cx="335" cy="213" r="11" fill="#FF9900"/>
  <text x="335" y="217" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">2</text>

  <!-- STEP 3: api → Datos (SELECT + GetObject) -->
  <line x1="535" y1="237" x2="1135" y2="237" stroke="#5A7A9C" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="835" y="231" text-anchor="middle" font-size="10" fill="#5A7A9C">SELECT project + objeto · GetObject fichero RCN</text>
  <circle cx="535" cy="237" r="11" fill="#FF9900"/>
  <text x="535" y="241" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3</text>

  <!-- ===== FASE 2: CASCADA ===== -->

  <!-- STEP 4: api → api-ai -->
  <line x1="535" y1="285" x2="735" y2="285" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="635" y="279" text-anchor="middle" font-size="10" fill="#0EA5E9">POST /generate-dictionary {fields, país}</text>
  <circle cx="535" cy="285" r="11" fill="#FF9900"/>
  <text x="535" y="289" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">4</text>

  <!-- STEP 5: api-ai SELF-LOOP (matching contra rcn-api) -->
  <path d="M746,303 L780,303 L780,313 L735,313" fill="none" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="788" y="310" font-size="10" fill="#0EA5E9">analizador · búsquedas en rcn-api (exacta + semántica) · juez Sonnet</text>
  <circle cx="735" cy="303" r="11" fill="#FF9900"/>
  <text x="735" y="307" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">5</text>

  <!-- ===== FASE 3: IA ===== -->

  <!-- STEP 6: api-ai → Bedrock (Sonnet · naming TC-015) -->
  <line x1="735" y1="343" x2="935" y2="343" stroke="#01A88D" stroke-width="2" marker-end="url(#arAI)"/>
  <text x="835" y="337" text-anchor="middle" font-size="10" font-weight="600" fill="#01A88D">InvokeModel · Sonnet · NAMING_SYSTEM_PROMPT (TC-015)</text>
  <circle cx="735" cy="343" r="11" fill="#FF9900"/>
  <text x="735" y="347" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">6</text>

  <!-- STEP 7: api-ai SELF-LOOP (validación RCN) -->
  <path d="M746,367 L780,367 L780,377 L735,377" fill="none" stroke="#0EA5E9" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="788" y="374" font-size="10" fill="#0EA5E9">busca el nombre en el RCN (rcn-api) · usa su metadata si ya existe</text>
  <circle cx="735" cy="367" r="11" fill="#FF9900"/>
  <text x="735" y="371" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">7</text>

  <!-- STEP 8: api-ai → Bedrock (Sonnet acortar, OPCIONAL) -->
  <line x1="735" y1="392" x2="935" y2="392" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arOpt)"/>
  <text x="835" y="386" text-anchor="middle" font-size="10" fill="#94A3B8" font-style="italic">(opcional) InvokeModel · Sonnet · acortar si supera 30 caracteres</text>
  <circle cx="735" cy="392" r="11" fill="#FF9900"/>
  <text x="735" y="396" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">8</text>

  <!-- ===== FASE 4: PERSISTENCIA ===== -->

  <!-- STEP 9: api-ai → api (return JSON) -->
  <line x1="735" y1="430" x2="535" y2="430" stroke="#5A7A9C" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="635" y="424" text-anchor="middle" font-size="10" fill="#5A7A9C">JSON {nombre_físico, nombre_lógico, descripción}</text>
  <circle cx="735" cy="430" r="11" fill="#FF9900"/>
  <text x="735" y="434" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">9</text>

  <!-- STEP 10: api → Datos (persist) - puesto encima de la lifeline final -->
  <line x1="535" y1="450" x2="1135" y2="450" stroke="#5A7A9C" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="835" y="444" text-anchor="middle" font-size="10" fill="#5A7A9C">INSERT diccionario · PutObject artefacto</text>
  <circle cx="535" cy="450" r="11" fill="#FF9900"/>
  <text x="535" y="454" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">10</text>

  <!-- ============ SECTION B: ZOOM ============ -->
  <text x="40" y="490" font-size="14" font-weight="700" fill="#1A2433">
    <tspan fill="#FF9900">2 ·</tspan> Zoom: api-ai + Bedrock
  </text>

  <!-- LEFT CARD: api-ai detail -->
  <g transform="translate(40, 504)" filter="url(#cs)">
    <rect width="600" height="196" rx="10" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.5"/>
    <rect width="600" height="4" rx="2" fill="#ED7100"/>
    <text x="20" y="26" font-size="9" font-weight="700" fill="#ED7100">SERVICIO IA · ECS FARGATE</text>
    <text x="20" y="46" font-size="16" font-weight="700" fill="#1A2433">bbva-ingesta-api-ai</text>
    <text x="20" y="62" font-size="10" fill="#5A7A9C">Matching contra el RCN y naming + descripción de campos (TC-015)</text>

    <!-- Provider switch -->
    <g transform="translate(20, 76)">
      <rect width="275" height="52" rx="6" fill="#FFF8EE" stroke="#ED7100" stroke-width="0.8"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#ED7100">PROVIDER SWITCHABLE</text>
      <text x="12" y="32" font-size="10" font-weight="600" fill="#1A2433">env LLM_PROVIDER = bedrock | anthropic</text>
      <text x="12" y="46" font-size="9" fill="#5A7A9C">Mismo cliente, dos backends intercambiables</text>
    </g>

    <!-- Retry -->
    <g transform="translate(305, 76)">
      <rect width="275" height="52" rx="6" fill="#FFF8EE" stroke="#ED7100" stroke-width="0.8"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#ED7100">RETRY · EXPONENTIAL BACKOFF</text>
      <text x="12" y="32" font-size="10" font-weight="600" fill="#1A2433">max 5 intentos · espera 2^n s</text>
      <text x="12" y="46" font-size="9" fill="#5A7A9C">Trigger: HTTP 529 (rate limit / sobrecarga)</text>
    </g>

    <!-- Cascade strategy -->
    <g transform="translate(20, 136)">
      <rect width="275" height="52" rx="6" fill="#FFF8EE" stroke="#ED7100" stroke-width="0.8"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#ED7100">ORDEN DE RESOLUCIÓN</text>
      <text x="12" y="32" font-size="10" font-weight="600" fill="#1A2433">1) reglas · 2) juez sobre RCN · 3) generación</text>
      <text x="12" y="46" font-size="9" fill="#5A7A9C">Generación solo sin match · RCN caído: 503</text>
    </g>

    <!-- Prompts -->
    <g transform="translate(305, 136)">
      <rect width="275" height="52" rx="6" fill="#FFF8EE" stroke="#ED7100" stroke-width="0.8"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#ED7100">PROMPTS · NAMING TC-015</text>
      <text x="12" y="32" font-size="10" font-weight="600" fill="#1A2433">analizador · juez · naming · acortar</text>
      <text x="12" y="46" font-size="9" fill="#5A7A9C">Few-shot con catálogos BBVA por país</text>
    </g>
  </g>

  <!-- RIGHT CARD: Bedrock detail -->
  <g transform="translate(660, 504)" filter="url(#cs)">
    <rect width="580" height="196" rx="10" fill="#FFFFFF" stroke="#01A88D" stroke-width="2"/>
    <rect width="580" height="4" rx="2" fill="#01A88D"/>
    <text x="20" y="26" font-size="9" font-weight="700" fill="#01A88D">AMAZON BEDROCK · LLM GESTIONADO</text>
    <text x="20" y="46" font-size="16" font-weight="700" fill="#1A2433">Claude (vía Bedrock)</text>
    <text x="20" y="62" font-size="10" fill="#5A7A9C">2 modelos · IAM-only · sin egress a internet</text>

    <!-- Models -->
    <g transform="translate(20, 76)">
      <rect width="540" height="52" rx="6" fill="#E6F8F4" stroke="#01A88D" stroke-width="0.8"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#01A88D">MODEL IDS · USO</text>
      <text x="12" y="32" font-size="10" font-family="Consolas, Courier New, monospace" fill="#1A2433">claude-sonnet-5-5  →  analizador, juez y naming</text>
      <text x="12" y="46" font-size="10" font-family="Consolas, Courier New, monospace" fill="#1A2433">mismo modelo por defecto (MATCHING_MODELO, LLM_MODEL)</text>
    </g>

    <!-- IAM -->
    <g transform="translate(20, 136)">
      <rect width="265" height="52" rx="6" fill="#E6F8F4" stroke="#01A88D" stroke-width="0.8"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#01A88D">IAM TASK ROLE</text>
      <text x="12" y="32" font-size="10" font-family="Consolas, monospace" fill="#1A2433">bedrock:InvokeModel</text>
      <text x="12" y="46" font-size="9" fill="#5A7A9C">scope: cross-region inference profile</text>
    </g>

    <!-- Latency -->
    <g transform="translate(295, 136)">
      <rect width="265" height="52" rx="6" fill="#E6F8F4" stroke="#01A88D" stroke-width="0.8"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#01A88D">LATENCIA TÍPICA</text>
      <text x="12" y="32" font-size="10" font-weight="600" fill="#1A2433">Sonnet 3-12 s</text>
      <text x="12" y="46" font-size="9" fill="#5A7A9C">batch processing por lista de campos</text>
    </g>
  </g>

</svg>
