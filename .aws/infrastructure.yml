AWSTemplateFormatVersion: '2010-09-09'
Description: 'Template para desplegar bbva-ingesta-app en AWS Amplify'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Configuración General"
        Parameters:
          - ProjectName
          - AppName
          - EnvironmentName
          - CostCenter
          - Owner
          - Region
      - Label:
          default: "Configuración de GitHub"
        Parameters:
          - Repository
          - Branch
          - GitHubToken
      - Label:
          default: "Variables de Entorno"
        Parameters:
          - NextPublicApiUrl
          - FirebaseApiKey
          - FirebaseAppId
          - FirebaseAuthDomain
          - FirebaseMessagingSenderId
          - FirebaseProjectId
          - FirebaseStorageBucket
    ParameterLabels:
      ProjectName:
        default: "Nombre del Proyecto"
      AppName:
        default: "Nombre de la Aplicación"
      EnvironmentName:
        default: "Ambiente"
      CostCenter:
        default: "Centro de Costos"
      Owner:
        default: "Propietario"
      Region:
        default: "Región AWS"
      Repository:
        default: "Repositorio GitHub"
      Branch:
        default: "Rama"
      GitHubToken:
        default: "Token de Acceso de GitHub"
      NextPublicApiUrl:
        default: "URL de la API"
      FirebaseApiKey:
        default: "Firebase API Key"
      FirebaseAppId:
        default: "Firebase App ID"
      FirebaseAuthDomain:
        default: "Firebase Auth Domain"
      FirebaseMessagingSenderId:
        default: "Firebase Messaging Sender ID"
      FirebaseProjectId:
        default: "Firebase Project ID"
      FirebaseStorageBucket:
        default: "Firebase Storage Bucket"

Parameters:
  ProjectName:
    Type: String
    Description: 'Nombre del proyecto (ej: bbva)'
    Default: 'bbva'
    MinLength: 1
    MaxLength: 20
    AllowedPattern: '[a-zA-Z0-9\-]+'
    ConstraintDescription: 'Solo letras, números y guiones'
  AppName:
    Type: String
    Description: 'Nombre de la aplicación'
    Default: 'ingesta-app'
    MinLength: 1
    MaxLength: 20
    AllowedPattern: '[a-zA-Z0-9\-]+'
    ConstraintDescription: 'Solo letras, números y guiones'
  Repository:
    Type: String
    Description: 'Nombre del repositorio en formato owner/repository'
    AllowedPattern: '^[a-zA-Z0-9\-]+\/[a-zA-Z0-9\-]+$'
    ConstraintDescription: 'Debe seguir el formato: usuario/repositorio'
  Branch:
    Type: String
    Description: 'Rama del repositorio a desplegar'
    Default: 'main'
    AllowedPattern: '[a-zA-Z0-9\-\/]+'
    ConstraintDescription: 'Solo letras, números, guiones y slashes'
  GitHubToken:
    Type: String
    Description: 'Token de acceso personal de GitHub para acceder al repositorio'
    NoEcho: true
  EnvironmentName:
    Type: String
    Description: 'Nombre del ambiente'
    Default: 'dev'
    AllowedValues:
      - dev
      - stg
      - prd
  CostCenter:
    Type: String
    Description: 'Centro de costos para facturación'
    Default: 'operations'
    MinLength: 1
    MaxLength: 50
  Owner:
    Type: String
    Description: 'Equipo o persona responsable'
    Default: 'innovation'
    MinLength: 1
    MaxLength: 50
  Region:
    Type: String
    Description: 'Región AWS donde se desplegará la aplicación'
    Default: 'us-east-2'
    AllowedValues:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - eu-west-1
      - eu-west-2
      - eu-central-1
      - sa-east-1
      - ap-southeast-1
      - ap-southeast-2
      - ap-northeast-1
      - ap-northeast-2

  # Variables de Firebase y API
  NextPublicApiUrl:
    Type: String
    Description: 'URL de la API pública'
    NoEcho: true
    AllowedPattern: '^https?:\/\/.*'
    ConstraintDescription: 'Debe ser una URL válida que comience con http:// o https://'

  FirebaseApiKey:
    Type: String
    Description: 'Firebase API Key'
    NoEcho: true

  FirebaseAppId:
    Type: String
    Description: 'Firebase App ID'
    NoEcho: true

  FirebaseAuthDomain:
    Type: String
    Description: 'Firebase Auth Domain'
    NoEcho: true

  FirebaseMessagingSenderId:
    Type: String
    Description: 'Firebase Messaging Sender ID'
    NoEcho: true

  FirebaseProjectId:
    Type: String
    Description: 'Firebase Project ID'
    NoEcho: true

  FirebaseStorageBucket:
    Type: String
    Description: 'Firebase Storage Bucket'
    NoEcho: true

Mappings:
  EnvironmentMap:
    dev:
      instanceSize: BASIC
      autoBuildEnabled: true
      amplifyStage: DEVELOPMENT
    stg:
      instanceSize: BASIC
      autoBuildEnabled: true
      amplifyStage: BETA
    prd:
      instanceSize: LARGE
      autoBuildEnabled: false
      amplifyStage: PRODUCTION

Conditions:
  IsPrd: !Equals [!Ref EnvironmentName, 'prd']
  IsNotPrd: !Not [!Equals [!Ref EnvironmentName, 'prd']]

Resources:
  # 1. Aplicación Amplify
  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Sub '${ProjectName}-${AppName}-${EnvironmentName}'
      Repository: !Sub 'https://github.com/${Repository}'
      AccessToken: !Ref GitHubToken
      Platform: WEB_COMPUTE
      IAMServiceRole: !GetAtt AmplifyRole.Arn
      CacheConfig:
        Type: AMPLIFY_MANAGED
      BuildSpec: !Sub |
        version: 1
        applications:
          - frontend:
              phases:
                preBuild:
                  commands:
                    - npm ci
                build:
                  commands:
                    - npm run build
              artifacts:
                baseDirectory: .next
                files:
                  - '**/*'
              cache:
                paths:
                  - node_modules/**/*
      CustomRules:
        - Source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map)$)([^.]+$)/'
          Target: '/index.html'
          Status: '200'
        - Source: '/<*>'
          Target: '/index.html'
          Status: '404'
      EnvironmentVariables:
        # Variables del sistema
        - Name: NODE_ENV
          Value: !Ref EnvironmentName
        - Name: NEXT_PUBLIC_APP_ENV
          Value: !Ref EnvironmentName
        - Name: APP_VERSION
          Value: !Ref 'AWS::StackId'
        
        # Variables de la aplicación - API y Firebase
        - Name: NEXT_PUBLIC_API_URL
          Value: !Ref NextPublicApiUrl
        - Name: NEXT_PUBLIC_FIREBASE_API_KEY
          Value: !Ref FirebaseApiKey
        - Name: NEXT_PUBLIC_FIREBASE_APP_ID
          Value: !Ref FirebaseAppId
        - Name: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
          Value: !Ref FirebaseAuthDomain
        - Name: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
          Value: !Ref FirebaseMessagingSenderId
        - Name: NEXT_PUBLIC_FIREBASE_PROJECT_ID
          Value: !Ref FirebaseProjectId
        - Name: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
          Value: !Ref FirebaseStorageBucket
      AutoBranchCreationConfig:
        EnableAutoBuild: !FindInMap [EnvironmentMap, !Ref EnvironmentName, autoBuildEnabled]
        EnablePullRequestPreview: !If [IsNotPrd, true, false]
        EnablePerformanceMode: !If [IsPrd, true, false]
      Tags:
        - Key: Environment
          Value: !Sub "${EnvironmentName}"
        - Key: Project
          Value: !Sub "${ProjectName}"
        - Key: CostCenter
          Value: !Sub "${CostCenter}"
        - Key: Owner
          Value: !Sub "${Owner}"
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CreatedBy
          Value: !Sub "${AWS::StackName}"

  # 2. Rama de Amplify
  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: !Ref Branch
      EnableAutoBuild: !FindInMap [EnvironmentMap, !Ref EnvironmentName, autoBuildEnabled]
      Framework: Next.js
      Stage: !FindInMap [EnvironmentMap, !Ref EnvironmentName, amplifyStage]
      EnvironmentVariables:
        # Variables del sistema
        - Name: NODE_ENV
          Value: !Ref EnvironmentName
        - Name: NEXT_PUBLIC_APP_ENV
          Value: !Ref EnvironmentName
        
        # Variables de la aplicación - API y Firebase
        - Name: NEXT_PUBLIC_API_URL
          Value: !Ref NextPublicApiUrl
        - Name: NEXT_PUBLIC_FIREBASE_API_KEY
          Value: !Ref FirebaseApiKey
        - Name: NEXT_PUBLIC_FIREBASE_APP_ID
          Value: !Ref FirebaseAppId
        - Name: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
          Value: !Ref FirebaseAuthDomain
        - Name: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
          Value: !Ref FirebaseMessagingSenderId
        - Name: NEXT_PUBLIC_FIREBASE_PROJECT_ID
          Value: !Ref FirebaseProjectId
        - Name: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
          Value: !Ref FirebaseStorageBucket
      Tags:
        - Key: Environment
          Value: !Sub "${EnvironmentName}"
        - Key: Project
          Value: !Sub "${ProjectName}"
        - Key: CostCenter
          Value: !Sub "${CostCenter}"
        - Key: Owner
          Value: !Sub "${Owner}"
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CreatedBy
          Value: !Sub "${AWS::StackName}"

  # 3. Grupo de Logs en CloudWatch
  AmplifyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/amplify/${ProjectName}-${AppName}-${EnvironmentName}'
      RetentionInDays: !If [IsPrd, 90, 30]
      Tags:
        - Key: Environment
          Value: !Sub "${EnvironmentName}"
        - Key: Project
          Value: !Sub "${ProjectName}"
        - Key: CostCenter
          Value: !Sub "${CostCenter}"
        - Key: Owner
          Value: !Sub "${Owner}"
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CreatedBy
          Value: !Sub "${AWS::StackName}"

  # 4. Política para los Logs
  AmplifyLogPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${ProjectName}-${AppName}-${EnvironmentName}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !GetAtt AmplifyLogGroup.Arn
      Roles:
        - !Ref AmplifyRole

  # 5. Rol de IAM para Amplify
  AmplifyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${AppName}-${EnvironmentName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${AppName}-${EnvironmentName}-amplify'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - amplify:*
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:UpdateStack
                  - cloudfront:CreateCloudFrontOriginAccessIdentity
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateInvalidation
                  - cloudfront:DeleteCloudFrontOriginAccessIdentity
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetCloudFrontOriginAccessIdentity
                  - cloudfront:GetCloudFrontOriginAccessIdentityConfig
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:UpdateCloudFrontOriginAccessIdentity
                  - cloudfront:UpdateDistribution
                  - s3:*
                  - iam:PassRole
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:InvokeFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: '*'
        - PolicyName: !Sub '${ProjectName}-${AppName}-${EnvironmentName}-secrets'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                  - ssm:GetParameter
                  - ssm:GetParametersByPath
                  - ssm:DescribeParameters
                  - secretsmanager:GetSecretValue
                  - secretsmanager:ListSecrets
                Resource: '*'
        - PolicyName: !Sub '${ProjectName}-${AppName}-${EnvironmentName}-logs'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: !Ref ProjectName
        - Key: Application
          Value: !Ref AppName
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: 'CloudFormation'
        - Key: CreatedBy
          Value: !Ref 'AWS::StackName'

Outputs:
  AmplifyAppId:
    Description: 'ID de la aplicación Amplify'
    Value: !GetAtt AmplifyApp.AppId
    Export:
      Name: !Sub '${AWS::StackName}-AmplifyAppId'

  DefaultDomain:
    Description: 'URL por defecto de la aplicación'
    Value: !Sub 'https://${AmplifyBranch.BranchName}.${AmplifyApp.DefaultDomain}'
    Export:
      Name: !Sub '${AWS::StackName}-DefaultDomain'

  ConsoleUrl:
    Description: 'URL de la consola de Amplify para esta aplicación'
    Value: !Sub 'https://console.aws.amazon.com/amplify/home?region=${Region}#/${AmplifyApp.AppId}'

  ResourceNames:
    Description: 'Nombres de los recursos creados'
    Value: !Sub |
      App Name: ${ProjectName}-${AppName}-${EnvironmentName}

  LogGroupName:
    Description: 'Nombre del grupo de logs en CloudWatch'
    Value: !Ref AmplifyLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-LogGroupName'

  EnvironmentVariables:
    Description: 'Variables de entorno configuradas'
    Value: !Sub |
      --- Variables del Sistema ---
      NODE_ENV: ${EnvironmentName}
      NEXT_PUBLIC_APP_ENV: ${EnvironmentName}
      APP_VERSION: ${AWS::StackId}
      
      --- Variables de la Aplicación ---
      NEXT_PUBLIC_API_URL: ${NextPublicApiUrl}
      NEXT_PUBLIC_FIREBASE_API_KEY: ********
      NEXT_PUBLIC_FIREBASE_APP_ID: ${FirebaseAppId}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${FirebaseAuthDomain}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${FirebaseMessagingSenderId}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${FirebaseProjectId}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${FirebaseStorageBucket}
    Export:
      Name: !Sub '${AWS::StackName}-EnvVars'